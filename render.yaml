databases:
  - name: switchdesk-db
    plan: free
    region: frankfurt
    databaseName: switchdesk
    user: switchdesk
    ipAllowList: []

services:
  - type: web
    name: switchdesk
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: switchdesk-db
          property: connectionString
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@switchdesk.local
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
